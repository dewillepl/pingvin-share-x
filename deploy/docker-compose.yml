# Pingvin Share X behind an external reverse proxy (e.g. Nginx Proxy Manager,
# Traefik or nginx running in Docker). Run from this directory after copying
# .env.example to .env. The image is built from this repository.

name: pingvin-share-x

services:
  pingvin-share-x:
    build:
      context: ..
      dockerfile: Dockerfile
    image: pingvin-share-x:local
    container_name: pingvin-share-x
    restart: unless-stopped
    # No "ports:" on purpose. Only the reverse proxy reaches the app through
    # the shared Docker network, which is what makes TRUST_PROXY=2 safe.
    environment:
      - TRUST_PROXY=${TRUST_PROXY:-2}
      - PUID=${PUID:?set PUID in .env}
      - PGID=${PGID:?set PGID in .env}
      - NODE_EXTRA_CA_CERTS=${NODE_EXTRA_CA_CERTS:-}
    volumes:
      - ${DATA_DIR:?set DATA_DIR in .env}:/opt/app/backend/data
      - ${DATA_DIR}/images:/opt/app/frontend/public/img
      - ./certs:/opt/app/certs:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?set PROXY_NETWORK in .env}
